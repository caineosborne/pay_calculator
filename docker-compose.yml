services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pay_checker
      POSTGRES_USER: pay_checker
      POSTGRES_PASSWORD: pay_checker_local
    ports:
      - "5432:5432"
    volumes:
      - pay-checker-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pay_checker -d pay_checker"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pay-checker-postgres:
